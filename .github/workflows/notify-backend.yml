name: Notify backend

# Hands merged requests to the private chaosberlin/backend repo, which writes DNS
# and reports back with the "dns/publish" commit status.
on:
  push:
    branches: [main]
    paths:
      - "requests/**"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # The token lives in this environment, which only the main branch may use.
    environment: backend-dispatch
    steps:
      - name: Start backend publish workflow
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: gh workflow run publish.yml -R chaosberlin/backend --ref main -f sha="$GITHUB_SHA"
