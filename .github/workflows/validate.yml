name: Validate subdomain requests

# pull_request_target runs this file and the scripts from main, not from the PR,
# so a PR cannot weaken the checks. PR files are fetched and parsed as data only.
# Never check out or run PR code here, and never add secrets to these jobs.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Check format and permissions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bun scripts/check-pr.ts

  https:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Check the target can serve HTTPS
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: bun scripts/check-https.ts
