name: Validate subdomain requests

on:
  pull_request:
    paths:
      - "requests/**"
      - "data/**"
      - "src/validation.ts"
      - "scripts/validate.ts"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Validate requests/*.json
        run: bun ./scripts/validate.ts
      - name: Dry-run Cloudflare plan
        run: bun ./scripts/provision.ts --dry-run
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN || 'example.com' }}
          CLOUDFLARE_API_TOKEN: changeme
          CLOUDFLARE_ZONE_ID: changeme
