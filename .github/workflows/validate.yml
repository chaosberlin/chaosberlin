name: Validate subdomain requests

# pull_request_target runs this file and scripts/check-pr.ts from main, not from
# the PR, so a PR cannot weaken the checks. The PR's files are fetched and parsed
# as data only. Never check out or run PR code in this workflow.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Check format and permissions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bun scripts/check-pr.ts
